<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #0a0e1a;
      color: #e5e7eb;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .title { font-size: 16px; font-weight: 700; }
    .subtitle { font-size: 11px; color: #6b7280; }
    .status {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label { color: #9ca3af; }
    .status-value { color: #f59e0b; font-weight: 600; }
    .btn {
      width: 100%;
      padding: 10px;
      background: #f59e0b;
      color: #0a0e1a;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #fbbf24; }
    .btn.secondary {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #374151;
      margin-top: 8px;
    }
    .btn.secondary:hover { border-color: #f59e0b; color: #f59e0b; }
    .tip {
      margin-top: 12px;
      padding: 10px;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 6px;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📚</div>
    <div>
      <div class="title">CodeReview</div>
      <div class="subtitle">代码知识收藏助手</div>
    </div>
  </div>

  <div class="status">
    <div class="status-row">
      <span class="status-label">待导入</span>
      <span class="status-value" id="pending-count">0 条</span>
    </div>
    <div class="status-row">
      <span class="status-label">连接状态</span>
      <span class="status-value" id="conn-status" style="color: #10b981;">● 已连接</span>
    </div>
  </div>

  <button class="btn" id="open-app">打开 CodeReview</button>
  <button class="btn secondary" id="save-current">保存当前页选中内容</button>

  <div class="tip">
    💡 使用方法：在任意网页选中文字，点击浮动按钮或右键选择"保存到 CodeReview"
  </div>

  <script src="popup.js"></script>
</body>
</html>
